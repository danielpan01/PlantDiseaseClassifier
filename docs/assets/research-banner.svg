<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Plant Disease Classifier</title>
  <desc id="desc">Independent research in agricultural computer vision by Daniel Pan. Three crops, fifteen source folders, two classes.</desc>
