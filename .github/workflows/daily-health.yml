name: Daily project health

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: America/New_York
    - cron: '43 10 * * *'
      timezone: America/New_York
    - cron: '29 12 * * *'
      timezone: America/New_York
    - cron: '11 14 * * *'
      timezone: America/New_York
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/maintenance/daily-health.md'

permissions:
  contents: read

concurrency:
  group: daily-project-health-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  choose-slot:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'danielpan01/PlantDiseaseClassifier' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - name: Choose this day's maintenance slot
        id: slot
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          slots = ['17 9 * * *', '43 10 * * *', '29 12 * * *', '11 14 * * *']
          today = datetime.now(ZoneInfo('America/New_York')).date()
          day = today.isoformat()
          seed = f"{os.environ['GITHUB_REPOSITORY']}:{day}".encode()
          index = 2 * (int.from_bytes(hashlib.sha256(seed).digest()[:8], 'big') % 2) + today.toordinal() % 2
          chosen = slots[index]
          run = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or os.environ['TRIGGER_SCHEDULE'] == chosen
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run={str(run).lower()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Selected schedule for {day}: `{chosen}` (America/New_York). Run now: {run}.\n")
          PYCODE

  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install project and audit dependencies (CPU wheels on CI)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Test the application and report failure handling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit all installed dependencies
        if: always() && !cancelled()
        run: python scripts/audit_dependencies.py

  report:
    needs: choose-slot
    if: needs.choose-slot.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: America/New_York
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install project and audit dependencies (CPU wheels on CI)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Test the application and report generation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect live maintenance observations
        id: health
        continue-on-error: true
        run: python scripts/daily_health.py
      - name: Publish report to the run summary
        run: cat docs/maintenance/daily-health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the updated report
        env:
          GIT_AUTHOR_NAME: Daniel
          GIT_AUTHOR_EMAIL: 146807695+danielpan01@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -- docs/maintenance/daily-health.md
          if git diff --cached --quiet; then
            echo 'The report is unchanged; no commit needed.'
            exit 0
          fi
          git -c commit.gpgsign=false commit -m "chore: automated daily health report ($(date +%F))"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Surface failed checks and vulnerability findings
        if: steps.health.outcome == 'failure'
        run: |
          echo 'Maintenance or vulnerability checks failed. See the committed report and run summary.'
          exit 1
